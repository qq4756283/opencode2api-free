services:
  opencode-gate:
    image: ${GATE_IMAGE:-opencode-gate:latest}
    container_name: opencode-gate
    restart: always
    ports:
      - "13339:13339"
    volumes:
      - ./data:/app/data
      - ./public:/app/public:ro
    environment:
      - PORT=13339
      - API_KEY=${API_KEY:-admin123}
      - DATA_DIR=/app/data
      # SingBox 版默认关；需要订阅节点时置 on 并保证 127.0.0.1:10801 有 sing-box
      - SINGBOX_MODE=${SINGBOX_MODE:-off}
      - SINGBOX_HOST=${SINGBOX_HOST:-127.0.0.1}
      - SINGBOX_HTTP_PORT=${SINGBOX_HTTP_PORT:-10800}
      - SINGBOX_SOCKS_PORT=${SINGBOX_SOCKS_PORT:-10801}
      - SINGBOX_API_PORT=${SINGBOX_API_PORT:-9090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13339/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
